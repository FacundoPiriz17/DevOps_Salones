
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-backend
  namespace: alumno-team9
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: reservas-backend
  template:
    metadata:
      labels:
        app: reservas-backend
    spec:
      containers:
        - name: flask
          image: salones-backend:replace-by-pipeline
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: reservas-config
            - secretRef:
                name: reservas-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
