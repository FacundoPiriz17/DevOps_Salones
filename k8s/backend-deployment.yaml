
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-backend
  namespace: reservas-salones
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-backend
  template:
    metadata:
      labels:
        app: reservas-backend
    spec:
      containers:
        - name: flask
          image: reservas-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: reservas-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reservas-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi