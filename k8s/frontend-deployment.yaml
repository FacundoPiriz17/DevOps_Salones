# frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-frontend
  labels:
    app: reservas-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-frontend
  template:
    metadata:
      labels:
        app: reservas-frontend
    spec:
      containers:
        - name: frontend
          image: reservas-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
