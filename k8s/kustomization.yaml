apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alumno-team9
resources:
  - configmap.yaml
  - mysql-pvc.yaml
  - mysql-service.yaml
  - mysql-deployment.yaml
  - backend-service.yaml
  - backend-deployment.yaml
  - frontend-service.yaml
  - frontend-deployment.yaml
  - ingress.yaml
configMapGenerator:
  - name: reservas-mysql-init
    files:
      - devops_init.sql=../db/devops_init.sql
      - init.sh=../jenkins/mysql-init.sh
